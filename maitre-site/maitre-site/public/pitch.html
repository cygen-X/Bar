<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />

<title>Maître · Le due versioni · Cabaret Voltaire</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,900&family=Spectral:ital,wght@0,300;0,400;0,500;0,600&family=JetBrains+Mono:wght@400;500;700&display=swap');
:root{--ink:#100b0d;--oxblood:#3b0e15;--oxblood2:#561620;--paper:#ece1cd;--paper-dim:#b3a589;
  --gold:#caa24b;--gold-soft:#e2c785;--line:rgba(202,162,75,.26);--verm:#d6432c;--ok:#7bbf8a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Spectral',Georgia,serif;color:var(--paper);background:
  radial-gradient(120% 60% at 85% -5%,rgba(86,22,32,.5),transparent 55%),
  radial-gradient(80% 50% at 0% 102%,rgba(202,162,75,.07),transparent 50%),var(--ink);
  line-height:1.62;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.sheet{max-width:880px;margin:0 auto;padding:0 26px 90px;}
.bar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9;
  padding:18px 0;border-bottom:1px solid var(--line);background:linear-gradient(var(--ink),rgba(16,11,13,.85));backdrop-filter:blur(6px);}
.brand{display:flex;gap:12px;align-items:center;}
.seal{width:38px;height:38px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--gold);font-family:'Fraunces',serif;font-weight:600;transform:rotate(-8deg);}
.brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:21px;line-height:1;}
.kick{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.26em;color:var(--gold);text-transform:uppercase;}
.toggle{display:flex;gap:4px;}
.toggle button{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--paper-dim);cursor:pointer;}
.toggle button.on{background:var(--gold);color:var(--ink);border-color:var(--gold);}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:13px;}
.hero{padding:54px 0 10px;}
h2.t{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(32px,5.4vw,52px);line-height:1.0;letter-spacing:-.01em;}
h2.t em{font-style:italic;color:var(--gold-soft);}
.lead{font-size:18px;color:var(--paper-dim);max-width:60ch;margin-top:16px;}
section{margin-top:52px;}
h3.s{font-family:'Fraunces',serif;font-weight:500;font-size:26px;margin-bottom:6px;}
.sub{color:var(--paper-dim);margin-bottom:20px;max-width:60ch;}
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.tier{border:1px solid var(--line);border-radius:18px;padding:24px;background:rgba(255,247,233,.03);position:relative;}
.tier.pro{border-color:var(--gold);background:linear-gradient(180deg,rgba(202,162,75,.09),rgba(255,247,233,.02));}
.tier .badge{position:absolute;top:-11px;right:18px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;background:var(--gold);color:var(--ink);padding:4px 11px;border-radius:999px;}
.tier h4{font-family:'Fraunces',serif;font-weight:500;font-size:24px;}
.tier .price{font-family:'Fraunces',serif;font-size:40px;font-weight:600;margin:6px 0 2px;}
.tier .price small{font-size:15px;color:var(--paper-dim);font-family:'Spectral',serif;}
.tier .tagline{color:var(--gold-soft);font-style:italic;margin-bottom:16px;}
.feat{list-style:none;display:grid;gap:9px;}
.feat li{position:relative;padding-left:24px;font-size:14.5px;line-height:1.45;}
.feat li::before{content:"\2726";position:absolute;left:0;color:var(--gold);font-size:12px;top:2px;}
.feat li.plus::before{content:"\FF0B";color:var(--gold-soft);}
.matrix{border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.mrow{display:flex;align-items:center;padding:11px 16px;border-top:1px solid var(--line);font-size:14px;}
.mrow:first-child{border-top:none;background:rgba(86,22,32,.3);font-family:'JetBrains Mono',monospace;
  font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);}
.mrow .f{flex:1;}
.mrow .c{width:64px;text-align:center;font-family:'JetBrains Mono',monospace;}
.yes{color:var(--ok);}.no{color:var(--paper-dim);opacity:.5;}
.chat{display:grid;gap:14px;}
.snip{border:1px solid var(--line);border-radius:13px;padding:15px 16px;background:rgba(0,0,0,.18);}
.bubo{font-size:14px;color:var(--gold-soft);font-style:italic;margin-bottom:7px;}
.bubo::before{content:"\201C";}.bubo::after{content:"\201D";}
.bubb{font-size:14px;color:#d8cdb6;line-height:1.5;}
.bubb b{color:var(--gold-soft);font-weight:500;}
.meter{border:1px solid var(--line);border-radius:13px;padding:18px;background:rgba(255,247,233,.03);margin-top:16px;}
.meter .h{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.track{height:9px;border-radius:999px;background:rgba(202,162,75,.18);overflow:hidden;}
.fill{height:100%;width:71%;background:var(--gold);border-radius:999px;}
.compare{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.col{border:1px solid var(--line);border-radius:16px;padding:20px;background:rgba(255,247,233,.03);}
.col.win{border-color:var(--gold);background:linear-gradient(180deg,rgba(202,162,75,.10),rgba(255,247,233,.02));}
.col .role{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
.col .cost{font-family:'Fraunces',serif;font-size:30px;font-weight:600;margin:6px 0;line-height:1;}
.col .cost small{font-size:13px;color:var(--paper-dim);font-family:'Spectral',serif;}
.col p{font-size:13px;color:var(--paper-dim);margin-top:8px;line-height:1.5;}
.col .lim{color:var(--verm);opacity:.85;}
.offer{border:1px dashed var(--gold);border-radius:16px;padding:22px;margin-top:16px;background:rgba(86,22,32,.25);}
.offer .amt{font-family:'Fraunces',serif;font-size:24px;color:var(--gold-soft);font-style:italic;}
.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.step{border:1px dashed var(--line);border-radius:12px;padding:15px;text-align:center;}
.step .n{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--gold);}
.step h5{font-family:'Fraunces',serif;font-weight:500;font-size:16px;margin:6px 0 4px;}
.step p{font-size:12px;color:var(--paper-dim);line-height:1.4;}
.cta{display:inline-block;margin-top:22px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;background:var(--gold);color:var(--ink);padding:15px 28px;border-radius:999px;text-decoration:none;}
.fine{font-size:12px;color:var(--paper-dim);margin-top:14px;}
.foot{margin-top:54px;padding-top:18px;border-top:1px solid var(--line);font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.1em;color:var(--paper-dim);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
@media(max-width:680px){.tiers,.compare{grid-template-columns:1fr;}.loop{grid-template-columns:1fr 1fr;}}
@media print{.bar{position:static;}.cta{display:none;}body{background:var(--ink);}}
</style>
</head>

function mark(v){return v ? '<span class="yes">\u2713</span>' : '<span class="no">\u2014</span>';}

function render(lang){
  const t = C[lang];
  document.documentElement.lang = lang;
  document.getElementById('bIt').classList.toggle('on', lang==='it');
  document.getElementById('bEn').classList.toggle('on', lang==='en');
  document.getElementById('footnote').textContent = t.foot;

  const pfeat = t.proFeat.map(f=>'<li class="plus">'+f+'</li>').join('');

    + t.rows.map(r=>'<div class="mrow"><div class="f">'+r[0]+'</div><div class="c">'+mark(r[1])+'</div><div class="c">'+mark(r[2])+'</div></div>').join('');
  const snips = t.snips.map(s=>'<div class="snip"><div class="bubo">'+s[0]+'</div><div class="bubb">'+s[1]+'</div></div>').join('');
  const cols = t.cols.map(c=>'<div class="col '+(c[4]?'':'win')+'"><div class="role">'+c[0]+'</div><div class="cost">'+c[1]+'<small>'+c[2]+'</small></div><p '+(c[4]?'class="lim"':'')+'>'+c[3]+'</p></div>').join('');

  document.getElementById('app').innerHTML =
    '<div class="hero"><div class="eyebrow">'+t.eyebrow+'</div>'+
    '<h2 class="t">'+t.h[0]+'<em>'+t.h[1]+'</em>'+t.h[2]+'</h2>'+
    '<p class="lead">'+t.lead+'</p></div>'+

    '<section><h3 class="s">'+t.howT+'</h3><p class="sub">'+t.howS+'</p>'+
    '<div class="loop">'+steps+'</div></section>'+

    '<section><h3 class="s">'+t.tiersT+'</h3><div class="tiers">'+
      '<div class="tier"><h4>'+t.basicName+'</h4>'+
        '<div class="price">'+t.basicPrice+'<small>'+t.basicPer+'</small></div>'+
        '<div class="tagline">'+t.basicTag+'</div><ul class="feat">'+bfeat+'</ul></div>'+
      '<div class="tier pro"><div class="badge">'+t.proBadge+'</div><h4>'+t.proName+'</h4>'+
        '<div class="price">'+t.proPrice+'<small>'+t.proPer+'</small></div>'+
        '<div class="tagline">'+t.proTag+'</div>'+
        '<div style="font-family:\'JetBrains Mono\',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:9px;">'+t.proHead+'</div>'+
        '<ul class="feat">'+pfeat+'</ul></div>'+
    '</div></section>'+

    '<section><h3 class="s">'+t.matrixT+'</h3><div class="matrix">'+rows+'</div></section>'+

    '<section><h3 class="s">'+t.smartT+'</h3><p class="sub">'+t.smartS+'</p>'+
    '<div class="chat">'+snips+'</div>'+
    '<div class="meter"><div class="h"><span>'+t.meterLabel+'</span><span>212 / 300</span></div>'+
    '<div class="track"><div class="fill"></div></div><p class="fine">'+t.meterNote+'</p></div></section>'+

    '<section><h3 class="s">'+t.costT+'</h3><p class="sub">'+t.costS+'</p>'+
    '<div class="compare">'+cols+'</div>'+
    '<p class="fine" style="color:var(--gold-soft);font-size:14px;margin-top:14px;">'+t.winNote+'</p></section>'+

    '<section><h3 class="s">'+t.priceT+'</h3><ul class="feat" style="gap:11px;">'+
    '<li>'+t.setup+'</li><li>'+t.annual+'</li><li>'+t.wa+'</li></ul>'+
    '<div class="offer"><div class="role" style="font-family:\'JetBrains Mono\',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);">'+t.offerTag+'</div>'+
    '<div class="amt">'+t.offerAmt+'</div><p class="fine" style="font-size:14px;">'+t.offerNote+'</p></div></section>'+

    '<section><h3 class="s">'+t.measureT+'</h3><p class="sub">'+t.measure+'</p>'+
    '<a class="cta" href="#">'+t.cta+'</a></section>';
}
render('it');
</script>
</body>
</html>
